<svg xmlns="http://www.w3.org/2000/svg" viewBox="330 342 364 308" width="100%" height="100%">
  <!-- Definitions for clean shared styling -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Red Accent Network / Top Node -->
    <g stroke="#ff0b55">
      <!-- Outer Top Node (thick outline) -->
      <path stroke-width="48" d="M 436 498 L 512 366 L 588 498 Z" />
      
      <!-- Central red terminal branch -->
      <line x1="512" y1="440" x2="512" y2="475" stroke-width="14" />
      
      <!-- Pink / Magenta Node Terminals -->
      <g fill="#ff0b55" stroke="none">
        <circle cx="512" cy="458" r="8" />
        <circle cx="387" cy="570" r="7" />
        <circle cx="414" cy="595" r="7" />
        <circle cx="613" cy="595" r="7" />
        <circle cx="640" cy="570" r="7" />
      </g>
    </g>

    <!-- White / Base Infrastructure Lines -->
    <g stroke="#f1f1f1" stroke-width="14">
      <!-- Central Trunk & Data Backbone -->
      <line x1="512" y1="475" x2="512" y2="585" />
      <path d="M 500 470 L 524 470" />
      <path d="M 496 536 C 496 546 528 546 528 556" />

      <!-- Left Cluster Backbone -->
      <path d="M 350 630 L 436 480" stroke-width="40" />
      <path d="M 405 505 L 452 552 L 486 552 L 486 585" />
      <path d="M 425 566 L 394 566" />
      <path d="M 423 605 L 423 630" />

      <!-- Right Cluster Backbone -->
      <path d="M 674 630 L 588 480" stroke-width="40" />
      <path d="M 619 505 L 572 552 L 538 552 L 538 585" />
      <path d="M 599 566 L 630 566" />
      <path d="M 601 605 L 601 630" />

      <!-- Horizontal Bottom Bars -->
      <line x1="340" y1="630" x2="435" y2="630" stroke-width="20" />
      <line x1="589" y1="630" x2="684" y2="630" stroke-width="20" />
    </g>
  </g>
</svg>